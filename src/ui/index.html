<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="./src/css/home.css">
    <!-- <link rel="icon" type="image/svg" href="../../public/icons/logo.svg"> -->
</head>
<body>
    <header>
        <figure>
            <img src="./src/assets/icons/logo.svg" alt="Logo of App">
        </figure>
        <button>
            <figure>
                <img src="./src/assets/icons/settings.svg" alt="Settings Icon">
            </figure>
            <span>Settings</span>
        </button>
    </header>
    <main>
        <h1>Welcome to To Do in Lua</h1>
        <p>This is a sample application in Lua with Web View as GUI (Graphical User Interface) totaly compatible with Windows Environment.
            You may manager your tasks controls and your tasks through this app.
        </p>
        <h2>Your Controls:</h2>
        <section class="controls">
            <!-- <a href="./src/pages/task_control.html">My First Control</a> -->
             <article class="create_control">
                <button onclick="invoke_task_creation(VerifyInvoke())">
                    <figure>
                        <img src="./src/assets/icons/create.svg" alt="Icon to create a new control">
                    </figure>
                </button>  
             </article>
        </section>
    </main>
    <script src="./src/middleware/VerifyInvoke.js"></script>
    <script src="./src/js/InvokeCreateTask.js"></script>
</body>
</html>
