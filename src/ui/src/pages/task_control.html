<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #252538;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { margin-top: 0; color: #89b4fa; }
        button {
            background-color: #a6e3a1;
            border: none;
            padding: 10px 15px;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minha Aplicação To-Do</h1>
        <p>Abaixo você integrará suas rotinas de Lua para salvar e gerenciar tarefas.</p>
        <button onclick="invoke_task_creation(VerifyInvoke())">Enviar Evento ao Lua</button>
        <button onclick="invoke_select_all_tasks(VerifyInvoke())">List Tasks</button>
    </div>

    <script src="../middleware/VerifyInvoke.js"></script>
    <script src="../js/InvokeCreateTask.js"></script>
    <script src="../js/InvokeSelectAllTask.js"></script>
</body>
</html>
